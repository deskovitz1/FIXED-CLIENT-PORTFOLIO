name: Verify production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Vercel's Git integration owns deployment and production environment secrets.
# This workflow independently checks compilation without deploying a second copy.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Required when Prisma is imported at build time; no pages query this DB
      # during prerendering. Production uses Vercel's real DATABASE_URL.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
